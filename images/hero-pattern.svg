<svg xmlns="http://www.w3.org/2000/svg" width="60" height="90" viewBox="0 0 60 90">
  <defs>
    <!-- Unskewed capsule shape with sharp TR and BL corners, rounded TL and BR -->
    <path id="s" d="M 0,70 L 7,70 A 7 7 0 0 0 14,63 L 14,0 L 7,0 A 7 7 0 0 0 0,7 Z" />
    <g id="skewed">
      <!-- Slew right by approx 18.4 degrees (tan = 1/3) -->
      <g transform="matrix(1, 0, -0.333333, 1, 0, 0)">
        <use href="#s" />
      </g>
    </g>
    <g id="tile">
      <use href="#skewed" x="5" y="0" />
      <use href="#skewed" x="20" y="45" />
    </g>
  </defs>
  <g fill="none" stroke="#cbd5e1" stroke-width="1.5">
    <!-- 3x3 grid to ensure seamless wrapping across the 60x90 viewport -->
    <use href="#tile" x="-60" y="-90" />
    <use href="#tile" x="0" y="-90" />
    <use href="#tile" x="60" y="-90" />

    <use href="#tile" x="-60" y="0" />
    <use href="#tile" x="0" y="0" />
    <use href="#tile" x="60" y="0" />

    <use href="#tile" x="-60" y="90" />
    <use href="#tile" x="0" y="90" />
    <use href="#tile" x="60" y="90" />
  </g>
</svg>
